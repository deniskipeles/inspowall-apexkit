<!--
__fileMetadata__ = {
  "name": "og-whatsapp-channel",
  "extension": "html",
  "type": "template",
  "path": "./templates/",
  "active": true
}
-->
<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Expanded Square Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="0.5" stop-color="#1E293B" />
      <stop offset="1" stop-color="#090D16" />
    </linearGradient>

    <!-- Scaled Ambient Glows -->
    <radialGradient id="glow-neon" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(200 300) scale(700)">
      <stop stop-color="#CCFF00" stop-opacity="0.15" />
      <stop offset="1" stop-color="#CCFF00" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1000 900) scale(800)">
      <stop stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Deep 3D Shadow -->
    <filter id="3d-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="30" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <clipPath id="card-clip">
      <rect width="980" height="580" rx="34" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="1200" fill="url(#bg-grad)" />
  <rect width="1200" height="1200" fill="url(#glow-neon)" />
  <rect width="1200" height="1200" fill="url(#glow-purple)" />

  <!-- MASSIVE TOP IMAGE CARD (1000x600) -->
  <g transform="translate(100, 80) rotate(-2, 500, 300)" filter="url(#3d-shadow)">
    <!-- Frame -->
    <rect x="0" y="0" width="1000" height="600" rx="40" fill="#1E293B" stroke="#334155" stroke-width="2" />

    <!-- Embedded Image -->
    <g transform="translate(10, 10)">
      <image
        href="{{ IMAGE_URL | default(value='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=') }}"
        x="0" y="0" width="980" height="580" preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip)" />
    </g>

    <!-- Glossy Inner Border -->
    <rect x="10" y="10" width="980" height="580" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.25"
      stroke-width="2" />
  </g>

  <!-- BOTTOM CONTENT AREA -->

  <!-- Brand Badge -->
  <g transform="translate(100, 730)">
    <rect x="0" y="0" width="240" height="46" rx="23" fill="#CCFF00" />
    <circle cx="23" cy="23" r="6" fill="#0F172A" />
    <text x="42" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" letter-spacing="0.5">
      {{ SITE_NAME | default(value="INSPOWALL") | upper }}
    </text>
  </g>

  <!-- DYNAMIC TERA TITLE (Max 2 Lines, ~30 chars per line, Font Size 60) -->
  <text x="100" y="835" font-family="sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF" letter-spacing="-1.5">
    {% set t_words = TITLE | default(value="Visual Inspiration") | split(pat=" ") %}
    {% set_global t_line = "" %}
    {% set_global t_count = 0 %}

    {% for w in t_words %}
    {% if t_count < 2 %} {% if t_line | length> 0 %}{% set test = t_line ~ " " ~ w %}{% else %}{% set test = w %}{%
      endif %}
      {% if test | length > 30 %}
      {% if t_count == 1 %}
      <tspan x="100" dy="70">{{ t_line }}...</tspan>
      {% set_global t_count = 2 %}
      {% else %}
      <tspan x="100" dy="{% if t_count == 0 %}0{% else %}70{% endif %}">{{ t_line }}</tspan>
      {% set_global t_line = w %}
      {% set_global t_count = t_count + 1 %}
      {% endif %}
      {% else %}
      {% set_global t_line = test %}
      {% endif %}
      {% endif %}
      {% endfor %}

      {% if t_count < 2 and t_line | length> 0 %}
        <tspan x="100" dy="{% if t_count == 0 %}0{% else %}70{% endif %}">{{ t_line }}</tspan>
        {% set_global t_count = t_count + 1 %}
        {% endif %}
  </text>

  <!-- SMART VERTICAL SHIFT FOR SUBTITLE -->
  <!-- If Title is 2 lines, push Subtitle down to y=980. If 1 line, pull up to y=910. -->
  {% set sub_y = 910 %}
  {% if t_count > 1 %}
  {% set sub_y = 980 %}
  {% endif %}

  <!-- DYNAMIC TERA SUBTITLE (Max 3 Lines, ~58 chars per line, Font Size 28) -->
  <text x="100" y="{{ sub_y }}" font-family="sans-serif" font-size="28" font-weight="500" fill="#94A3B8"
    line-height="1.5">
    {% set s_words = SUBTITLE | default(value="Discover and curate amazing visual imagery on InspoWall.") | split(pat="
    ") %}
    {% set_global s_line = "" %}
    {% set_global s_count = 0 %}

    {% for w in s_words %}
    {% if s_count < 3 %} {% if s_line | length> 0 %}{% set test = s_line ~ " " ~ w %}{% else %}{% set test = w %}{%
      endif %}
      {% if test | length > 58 %}
      {% if s_count == 2 %}
      <tspan x="100" dy="38">{{ s_line }}...</tspan>
      {% set_global s_count = 3 %}
      {% else %}
      <tspan x="100" dy="{% if s_count == 0 %}0{% else %}38{% endif %}">{{ s_line }}</tspan>
      {% set_global s_line = w %}
      {% set_global s_count = s_count + 1 %}
      {% endif %}
      {% else %}
      {% set_global s_line = test %}
      {% endif %}
      {% endif %}
      {% endfor %}

      {% if s_count < 3 and s_line | length> 0 %}
        <tspan x="100" dy="{% if s_count == 0 %}0{% else %}38{% endif %}">{{ s_line }}</tspan>
        {% endif %}
  </text>

  <!-- Full-Width Footer (Photographer & Platform) -->
  <g transform="translate(100, 1080)">
    <rect x="0" y="0" width="1000" height="70" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="28" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748B"
      letter-spacing="0.5">PHOTO BY</text>
    <text x="28" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC">
      {{ PHOTOGRAPHER | default(value="Community Artist") | truncate(length=40) }}
    </text>

    <!-- Platform Badge -->
    <rect x="830" y="15" width="140" height="40" rx="20" fill="#334155" />
    <text x="900" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#CCFF00" text-anchor="middle">
      {{ PLATFORM | default(value="INSPOWALL") | upper }}
    </text>
  </g>
</svg>
